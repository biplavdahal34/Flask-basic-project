{% extends "layout.html" %}
{% block content %}
    <article class="media content-section">
        <img class="rounded-circle article-img" src="{{url_for('static', filename='profile_pictures/' + post.author.image)}}">
        <div class="media-body">
            <div class="article-metadata">
                <a class="mr-2" href="{{url_for('users.selected_account',username = post.author.username)}}">{{ post.author.username}}</a>
                <small class="text-muted">{{ post.date_posted.strftime('%Y-%m-%d')}}</small>
                {% if current_user == post.author%}
                <div>
                    <a class="btn btn-secondary btn-sm m-1" href="{{url_for('posts.modify_post', post_id=post.id)}}">Update Post</a>
                    <button type ="button" class="btn btn-danger btn-sm m-1" data-toggle="modal" data-target="#deleteModal">Delete Post</button>
                </div>
                {%endif%}
            </div>

        <h2 class="article-title">{{ post.title }}</h2>
        <p class="article-content">{{ post.content }}</p>
        </div>
    </article>

<!-- Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalLabel">Are You Sure You Want To Delete This Post?</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            <form action="{{ url_for('posts.delete_post', post_id=post.id) }}" method='POST'>
                <input class="btn btn-danger" type="submit" value="Delete Post">

            </form>
        </div>
      </div>
    </div>
  </div>

{% endblock content %}
